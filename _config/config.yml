---
Name: silvershop-colors
After:
  - '#silvershop'
---
# Product-level colours describe the product (e.g. a red shirt with blue sleeves). A variation's colour is its
# "Shirt Colour" ATTRIBUTE (not a separate relation), so the extension is applied to Product only.
SilverShop\Page\Product:
  extensions:
    - SilverShop\Colors\ColorableExtension

# CMS-only: render colour swatches next to the product Colours listbox and the variation colour dropdown.
SilverStripe\Admin\LeftAndMain:
  extensions:
    - SilverShop\Colors\ColorCmsExtension
